[project]
name = "mrag-mlx"
version = "0.1.0"
description = "Multi-head attention embeddings for multi-aspect retrieval, toy scale, in MLX"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
